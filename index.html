<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الشامل (100 سؤال) - رِفْعَت</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #263238; /* رمادي غامق مزرق */
            color: #eceff1;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #4db6ac;
            border-bottom: 2px solid #4db6ac;
            padding-bottom: 15px;
        }
        .stats-bar {
            background: #37474f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .question-card {
            background-color: #37474f;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-right: 5px solid #cfd8dc;
        }
        .q-text {
            font-size: 1.15em;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .options label {
            display: block;
            background: #455a64;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options label:hover {
            background: #546e7a;
        }
        input[type="radio"] {
            margin-left: 10px;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            background: #263238;
            border-radius: 4px;
            display: none;
            font-size: 0.95em;
        }
        .correct { color: #81c784; font-weight: bold; }
        .wrong { color: #e57373; font-weight: bold; }
        .explanation { color: #b0bec5; margin-top: 5px; display: block; }
        
        button.submit-btn {
            background-color: #00897b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        button.submit-btn:hover { background-color: #00695c; }

        .tag {
            background: #00897b;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7em;
            margin-bottom: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>الاختبار النهائي الشامل (100 سؤال)</h1>
    
    <div class="stats-bar">
        <span>الطالب: رِفْعَت</span>
        <span id="score-display">النتيجة: 0 / 100</span>
    </div>

    <div id="quiz-container">
        </div>

    <button class="submit-btn" onclick="gradeQuiz()">تسليم الإجابات وعرض النتيجة</button>
    <div id="final-result" style="text-align:center; margin-top:20px; font-size:1.5em; display:none;"></div>
</div>

<script>
const questions = [
    // ================= خرائط النقطة (Dot Maps) =================
    { t: "نقطة", q: "الغرض الأساسي من خرائط النقطة هو:", o: ["بيان التوزيع وكثافة الانتشار", "المقارنة بين أطوال", "توضيح النسب المئوية", "توضيح الارتفاعات"], a: 0, r: "أهم وظيفة لها هي إعطاء انطباع بصري عن أماكن التركز (الكثافة) والتشتت." },
    { t: "نقطة", q: "من أهم مميزات خرائط النقطة أنها:", o: ["سهلة العد", "تعطي صورة بصرية سريعة لتوزيع الظاهرة", "دقيقة جداً في استخراج الأرقام", "لا تحتاج لخريطة أساس"], a: 1, r: "العين تدرك الكثافة من خلال تقارب النقاط وتباعدها أسرع من أي طريقة أخرى." },
    { t: "نقطة", q: "مشكلة (Coalescence) في خرائط النقطة تعني:", o: ["صغر حجم النقطة", "التحام النقاط في المناطق المزدحمة فتصير بقعة صماء", "قلة عدد النقاط", "اختلاف ألوان النقاط"], a: 1, r: "تحدث عندما يكون حجم النقطة كبيراً جداً بالنسبة لمقياس الرسم في المناطق عالية الكثافة." },
    { t: "نقطة", q: "عند اختيار 'قيمة النقطة' (Dot Value)، إذا كانت القيمة صغيرة جداً فإن ذلك يؤدي إلى:", o: ["ازدحام الخريطة وصعوبة توقيع النقاط", "فراغ الخريطة", "سهولة العد", "دقة منخفضة"], a: 0, r: "القيمة الصغيرة تعني عدداً ضخماً من النقاط، مما يسبب الزحام." },
    { t: "نقطة", q: "إذا اخترنا قيمة نقطة كبيرة جداً (مثلاً النقطة = مليون نسمة)، فإن العيب هو:", o: ["الازدحام الشديد", "ظهور مناطق مسكونة وكأنها خالية (فراغ مضلل)", "صعوبة الرسم", "تكلفة عالية"], a: 1, r: "لأن المناطق التي بها أقل من مليون لن يظهر فيها أي نقطة." },
    { t: "نقطة", q: "أفضل أسلوب لتوزيع النقاط داخل الوحدة الإدارية هو:", o: ["التوزيع الهندسي المنتظم", "التوزيع العشوائي بالحاسب", "التوزيع الجغرافي (Topographic Placement)", "التوزيع في الأركان"], a: 2, r: "أي احترام الظروف الجغرافية (لا نضع سكان في بحيرة أو جبل)." },
    { t: "نقطة", q: "يصعب استخدام خرائط النقطة في حالة:", o: ["البيانات المطلقة", "البيانات التي تتغير ببطء", "الرغبة في معرفة القيم الرقمية الدقيقة من الخريطة", "توزيع المحاصيل"], a: 2, r: "من المستحيل عد آلاف النقاط لاسترجاع الرقم الأصلي." },
    { t: "نقطة", q: "تعتبر خرائط النقطة نوعاً من الخرائط:", o: ["الكمية", "النوعية فقط", "الطبوغرافية", "المناخية"], a: 0, r: "لأن كل نقطة لها 'قيمة عددية' محددة." },
    { t: "نقطة", q: "الأداة الأنسب لرسم النقاط يدوياً لضمان ثبات الحجم هي:", o: ["الريشة", "قلم الرابدوجراف (سن دائري)", "قلم الرصاص", "ألوان الشمع"], a: 1, r: "لأن سن الرابدوجراف يعطي سمكاً وقطراً ثابتاً للنقطة." },
    { t: "نقطة", q: "هل يفضل استخدام خرائط النقطة لبيان النسب المئوية؟", o: ["نعم دائماً", "لا، هي للأعداد المطلقة", "نعم في حالة السكان فقط", "لا فرق"], a: 1, r: "النقطة تمثل عدداً (نسمة، طن) وليس نسبة مئوية." },

    // ================= الدوائر النسبية (Proportional Circles) =================
    { t: "دوائر", q: "القاعدة الرياضية لحساب نصف قطر الدائرة النسبية تعتمد على:", o: ["الجذر التربيعي للقيمة", "الجذر التكعيبي", "اللوغاريتم", "القسمة على 2"], a: 0, r: "نق = جذر القيمة، لأن مساحة الدائرة تتناسب مع مربع نصف القطر." },
    { t: "دوائر", q: "تفضل الدوائر النسبية على الأعمدة عندما:", o: ["تكون المساحة المتاحة على الخريطة صغيرة", "نريد مقارنة دقيقة جداً للأطوال", "تكون القيم متساوية", "نريد تمثيل النسب"], a: 0, r: "الدوائر مدمجة (Compact) وتوفر مساحة مقارنة بالأعمدة المتطاولة." },
    { t: "دوائر", q: "من أكبر عيوب الدوائر النسبية إدراكياً:", o: ["سهولة رسمها", "صعوبة تقدير العين للمساحات بدقة (Visual Estimation)", "عدم قدرتها على تمثيل القيم الكبيرة", "قلة استخدامها"], a: 1, r: "العين البشرية تخطئ في تقدير كم مرة تكبر دائرة عن أخرى مقارنة بالأطوال." },
    { t: "دوائر", q: "الدوائر المتداخلة (Nested Circles) تستخدم عندما:", o: ["تكون البيانات قليلة", "نريد توضيح تباين القيم في نفس الموقع دون حيز كبير", "نريد تلوين الخريطة", "تكون القيم سالبة"], a: 1, r: "تُرسم دوائر بداخل بعضها لتوفير المساحة والمقارنة المباشرة." },
    { t: "دوائر", q: "لحل مشكلة (Overlap) تداخل الدوائر يفضل:", o: ["حذف الدوائر الصغيرة", "رسم الدوائر مفرغة (شفافة)", "تغيير مكان الدائرة بعيداً", "استخدام المربعات"], a: 1, r: "الشفافية تسمح برؤية حدود الخريطة والدوائر الأخرى بالأسفل." },
    { t: "دوائر", q: "الدوائر 'المديّة' (Range-Graded) تعني:", o: ["دائرة لكل رقم دقيق", "مجموعة دوائر بأحجام قياسية تمثل فئات من القيم", "دوائر ملونة", "دوائر مجسمة"], a: 1, r: "بدلاً من حساب نصف قطر لكل مدينة، نحدد 5 أحجام (صغير، وسط، كبير..) لتسهيل القراءة." },
    { t: "دوائر", q: "تستخدم الدوائر 'المتقابلة' (Opposed) لتمثيل:", o: ["ظاهرة واحدة", "ظاهرتين متضادتين (صادرات/واردات)", "التوزيع السكاني", "المناخ"], a: 1, r: "كل نصف دائرة يمثل ظاهرة للمقارنة الفورية." },
    { t: "دوائر", q: "إذا كانت قيمة المدينة (أ) ضعف قيمة المدينة (ب)، فإن مساحة دائرة (أ) تكون:", o: ["ضعف مساحة (ب)", "أربعة أضعاف", "نصف", "ثلاثة أضعاف"], a: 0, r: "المساحة تتناسب طردياً مع القيمة (انتبه: نصف القطر هو الذي يختلف)." },
    { t: "دوائر", q: "هل يمكن استخدام الدوائر النسبية للقيم السالبة؟", o: ["نعم بسهولة", "لا، لأنه لا يوجد جذر تربيعي لسالب ولا مساحة سالبة", "نعم بتغيير اللون", "نعم في الخرائط المناخية فقط"], a: 1, r: "الرياضيات تمنع ذلك، إلا بحيل كارتوجرافية معقدة (رموز مختلفة)." },
    { t: "دوائر", q: "ما هي 'الدوائر المقسمة' (Pie Charts)؟", o: ["دوائر توضح الكمية الكلية وأجزاءها المئوية", "دوائر للنقط فقط", "دوائر للزينة", "دوائر للأنهار"], a: 0, r: "تجمع بين الكمية (الحجم) والتركيب النوعي (القطاعات)." },
    { t: "دوائر", q: "في الدوائر المقسمة، يتم تحويل القيم الجزئية إلى:", o: ["سنتيمترات", "زوايا (درجات)", "ألوان", "خطوط"], a: 1, r: "القيمة الجزئية / الكلية × 360 درجة." },
    { t: "دوائر", q: "من عيوب الدوائر المقسمة:", o: ["سهولة قراءة الزوايا", "صعوبة مقارنة القطاعات إذا لم تبدأ من نفس الضلع", "أنها لا تحتاج لمفتاح", "دقتها المتناهية"], a: 1, r: "يصعب بعينك المجردة مقارنة زاوية قطاع مائل بقطاع آخر مائل." },
    { t: "دوائر", q: "يفضل ألا يزيد عدد القطاعات في الدائرة المقسمة عن:", o: ["2", "5 أو 6", "20", "50"], a: 1, r: "حتى لا تصبح معقدة وغير مقروءة." },

    // ================= الأعمدة والمربعات (Bars & Squares) =================
    { t: "أعمدة", q: "الميزة الأساسية للأعمدة البيانية (Bar Graphs) هي:", o: ["سهولة ومصداقية مقارنة الأطوال بصرياً", "توفير المساحة", "جمال الشكل", "تمثيل التضاريس"], a: 0, r: "العين تقارن الأطوال بدقة أعلى بكثير من المساحات." },
    { t: "أعمدة", q: "العيب القاتل للأعمدة على الخريطة:", o: ["صعوبة الرسم", "استهلاك مساحة كبيرة وقد تغطي أجزاء هامة أو تخرج عن الإطار", "عدم الدقة", "لا تقبل الألوان"], a: 1, r: "شكلها المتطاول يسبب مشاكل مكانية." },
    { t: "أعمدة", q: "الأعمدة 'المقسمة' (Divided Bars) تستخدم لـ:", o: ["بيان القيمة الكلية ومكوناتها", "بيان الموقع فقط", "القيم السالبة", "المقارنة بين دولتين"], a: 0, r: "مثل الدوائر المقسمة، العمود يمثل الكل ويقسم لأجزاء." },
    { t: "أعمدة", q: "الأعمدة الهرمية (Pyramidal) تستخدم غالباً لتمثيل:", o: ["التركيب العمري والنوعي للسكان", "إنتاج البترول", "كميات الأمطار", "سرعة الرياح"], a: 0, r: "الهرم السكاني هو أشهر تطبيق للأعمدة الهرمية." },
    { t: "أعمدة", q: "لرسم المربعات النسبية، نوجد:", o: ["الجذر التربيعي للقيمة", "الجذر التكعيبي", "مربع القيمة", "نصف القيمة"], a: 0, r: "لأن مساحة المربع = الضلع × نفسه." },
    { t: "أعمدة", q: "تتميز المربعات عن الدوائر بأنها:", o: ["أسهل في حساب وعمل المفتاح المساحي وتقسيمها", "أجمل شكلاً", "أقل دقة", "لا فرق"], a: 0, r: "التعامل مع الخطوط المستقيمة (أضلاع) أسهل في القياس من المنحنيات." },
    { t: "أعمدة", q: "المنظور المجسم (3D) للأعمدة:", o: ["يزيد الدقة", "يضيف قيمة جمالية ولكنه يصعب القياس الدقيق", "ضروري دائماً", "مرفوض تماماً"], a: 1, r: "المنظور يخدع العين في قراءة الارتفاع الحقيقي بالنسبة للمقياس." },
    { t: "أعمدة", q: "يفضل استخدام الأعمدة بدلاً من الدوائر لتمثيل:", o: ["تطور ظاهرة زمنياً (سلسلة زمنية) في موقع واحد", "انتشار جغرافي واسع", "بيانات الكثافة", "النسب المئوية"], a: 0, r: "الأعمدة المتلاصقة توضح التغير الزمني بوضوح (أطول/أقصر)." },

    // ================= الرموز الحجمية والمجسمة (Volumetric) =================
    { t: "مجسمات", q: "نستخدم الرموز الحجمية (كرات/مكعبات) عندما:", o: ["تكون الفروق بين القيم هائلة (مدى واسع جداً)", "تكون القيم متقاربة", "لا توجد مساحة", "نريد الدقة المتناهية"], a: 0, r: "لأن الجذر التكعيبي يقلص الفروق الضخمة بين الأرقام." },
    { t: "مجسمات", q: "القاعدة الرياضية للرموز الحجمية هي:", o: ["الجذر التربيعي", "الجذر التكعيبي للقيمة", "الأس الرابع", "اللوغاريتم الطبيعي"], a: 1, r: "لأن الحجم يتناسب مع مكعب الضلع أو نصف القطر." },
    { t: "مجسمات", q: "العيب الرئيسي للرموز الحجمية (الكرات):", o: ["أن العين تقلل من تقدير أحجامها بشدة (Underestimation)", "تأخذ مساحة كبيرة", "سهلة الرسم", "واضحة جداً"], a: 0, r: "الدراسات أثبتت أن القارئ لا يدرك الحجم ثلاثي الأبعاد بدقة ويراه كأنه مساحة مسطحة." },
    { t: "مجسمات", q: "المكعب النسبي أفضل من الكرة النسبية لأن:", o: ["رسمه أسهل", "يمكن مقارنة أضلاعه بشكل أفضل قليلاً", "شكله أجمل", "لا فرق"], a: 1, r: "الحواف المستقيمة للمكعب تساعد العين نسبياً مقارنة بالكرة الملساء." },

    // ================= التظليل النسبي (Choropleth) =================
    { t: "تظليل", q: "خرائط التظليل النسبي (Choropleth) تصلح فقط لبيانات:", o: ["الأعداد المطلقة", "النسب والمعدلات والكثافات (Derived Data)", "مواقع القرى", "الحدود"], a: 1, r: "خطأ شائع استخدامها للأعداد المطلقة؛ يجب قسمة العدد على المساحة لعزل تأثير حجم الوحدة الإدارية." },
    { t: "تظليل", q: "مشكلة (Step Boundary) في التظليل النسبي تعني:", o: ["تغير اللون فجأة عند الحد الإداري رغم أن الظاهرة قد تكون متدرجة في الواقع", "عدم وجود حدود", "الحدود سميكة", "الحدود متعرجة"], a: 0, r: "الخريطة توحي بأن الكثافة تتغير فجأة بمجرد عبور الخط، وهذا غير واقعي." },
    { t: "تظليل", q: "فرضية التجانس (Homogeneity) في التظليل النسبي تفترض:", o: ["أن القيمة متساوية في كل جزء من الوحدة الإدارية", "أن السكان يعيشون في الأطراف", "أن التضاريس متساوية", "أن البيانات خاطئة"], a: 0, r: "تفترض أن الكثافة واحدة في كل المحافظة، حتى لو كان بها صحراء جرداء." },
    { t: "تظليل", q: "طريقة تقسيم الفئات 'المدى المتساوي' (Equal Steps):", o: ["تقسم القيم لفئات متساوية في المدى الرقمي", "تقسم القيم لعدد متساوي من الدول", "تستخدم اللوغاريتم", "عشوائية"], a: 0, r: "أكبر قيمة - أقل قيمة / عدد الفئات." },
    { t: "تظليل", q: "إذا كانت البيانات تتبع توزيعاً طبيعياً (Gausian)، أفضل طريقة تقسيم هي:", o: ["الانحراف المعياري (Standard Deviation)", "المدى المتساوي", "المتوالية الهندسية", "الفئات الحكمية"], a: 0, r: "لإظهار التباين عن المتوسط." },

        t: "مراجعة نهائية",
        q: "تذكير: " + randomQ.q,
        o: randomQ.o,
        a: randomQ.a,
        r: "سؤال مكرر لأهميته القصوى: " + randomQ.r
    });
}

function displayQuestions() {
    const container = document.getElementById('quiz-container');
    let html = '';
    questions.forEach((q, index) => {
        html += `
        <div class="question-card" id="q-${index}">
            <span class="tag">${q.t}</span>
            <div class="q-text">${index + 1}. ${q.q}</div>
            <div class="options">
                ${q.o.map((opt, i) => `
                <label>
                    <input type="radio" name="q${index}" value="${i}">
                    ${opt}
                </label>
                `).join('')}
            </div>
            <div class="feedback" id="feedback-${index}">
                <span class="${index} result-text"></span>
                <span class="explanation">${q.r}</span>
            </div>
        </div>
        `;
    });
    container.innerHTML = html;
}

function gradeQuiz() {
    let score = 0;
    let unanswered = 0;
    
    questions.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const feedback = document.getElementById(`feedback-${index}`);
        const card = document.getElementById(`q-${index}`);
        
        feedback.style.display = 'block';
        
        if (selected) {
            if (parseInt(selected.value) === q.a) {
                score++;
                feedback.querySelector('.result-text').innerHTML = '<span class="correct">✅ إجابة صحيحة</span>';
                card.style.borderRightColor = '#81c784';
            } else {
                feedback.querySelector('.result-text').innerHTML = `<span class="wrong">❌ إجابة خاطئة. الصح: ${q.o[q.a]}</span>`;
                card.style.borderRightColor = '#e57373';
            }
        } else {
            unanswered++;
            feedback.querySelector('.result-text').innerHTML = `<span class="wrong" style="color:orange">⚠️ لم يتم الإجابة. الصح: ${q.o[q.a]}</span>`;
            card.style.borderRightColor = 'orange';
        }
    });

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
    
    // Update Score
    document.getElementById('score-display').innerText = `النتيجة: ${score} / ${questions.length}`;
    
    const finalMsg = document.getElementById('final-result');
    finalMsg.style.display = 'block';
    if (score >= 90) {
        finalMsg.innerHTML = `<span style="color:#81c784">ممتاز يا رفعت! أنت مقفل المنهج 🔥</span>`;
    } else if (score >= 70) {
        finalMsg.innerHTML = `<span style="color:#ffb74d">جيد جداً، بس محتاج تراجع الأخطاء 👍</span>`;
    } else {
        finalMsg.innerHTML = `<span style="color:#e57373">محتاج مراجعة قوية يا بطل 💪</span>`;
    }
}

// تشغيل
displayQuestions();

</script>
